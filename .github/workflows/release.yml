name: Release Installers

# タグ push (`v*`) または手動実行で macOS dmg / Windows exe を生成し、
# GitHub Releases に添付する。jpackage はクロスコンパイル不可のため
# OS ごとにジョブを分けてマトリクスで並列ビルドする。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: 'build/jpackage/*.dmg'
            artifact_name: macos-dmg
          - os: windows-latest
            artifact_glob: 'build/jpackage/*.exe'
            artifact_name: windows-exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native installer
        run: ./gradlew jpackage --no-daemon
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*
            artifacts/windows-exe/*
          generate_release_notes: true
